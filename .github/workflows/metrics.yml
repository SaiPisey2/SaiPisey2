name: Generate metrics

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity and language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/stats.svg metrics/languages.svg
          git diff --quiet --cached || git commit -m "Refresh profile stat cards"
          git push

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SaiPisey2
          filename: metrics/calendar.svg
          committer_branch: main
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
